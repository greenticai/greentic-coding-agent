[workspace]
members = [
    "crates/gca-agent-files",
    "crates/gca-cli",
    "crates/gca-core",
    "crates/gca-engine",
    "crates/gca-greentic",
    "crates/gca-index",
    "crates/gca-mcp",
    "crates/gca-oci",
    "crates/gca-query",
]
resolver = "2"

[workspace.package]
version = "1.1.0-dev.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/greenticai/greentic-coding-agent"
homepage = "https://github.com/greenticai/greentic-coding-agent"
documentation = "https://docs.rs/greentic-coding-agent"

[workspace.dependencies]
serde_json = "1.0"
sha2 = "0.11"
tantivy = "0.26"
thiserror = "2.0"

[workspace.dependencies.clap]
version = "4.5"
features = [
    "derive",
]

[workspace.dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[workspace.dependencies.syn]
version = "2.0"
features = [
    "full",
    "parsing",
]
