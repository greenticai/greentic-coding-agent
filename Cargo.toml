[workspace]
members = [
    "crates/gca-agent-files",
    "crates/gca-cli",
    "crates/gca-core",
    "crates/gca-greentic",
    "crates/gca-index",
    "crates/gca-mcp",
    "crates/gca-oci",
    "crates/gca-query",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/greenticai/greentic-coding-agent"
homepage = "https://github.com/greenticai/greentic-coding-agent"
documentation = "https://docs.rs/greentic-coding-agent"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.22"
thiserror = "2.0"
