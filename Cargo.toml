[workspace]
members = [
    "crates/gca-agent-files",
    "crates/gca-cli",
    "crates/gca-core",
    "crates/gca-engine",
    "crates/gca-greentic",
    "crates/gca-index",
    "crates/gca-mcp",
    "crates/gca-oci",
    "crates/gca-query",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/greenticai/greentic-coding-agent"
homepage = "https://github.com/greenticai/greentic-coding-agent"
documentation = "https://docs.rs/greentic-coding-agent"

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8"
gca-agent-files = { path = "crates/gca-agent-files" }
gca-core = { path = "crates/gca-core" }
gca-engine = { path = "crates/gca-engine" }
gca-greentic = { path = "crates/gca-greentic" }
gca-index = { path = "crates/gca-index" }
gca-mcp = { path = "crates/gca-mcp" }
gca-oci = { path = "crates/gca-oci" }
gca-query = { path = "crates/gca-query" }
predicates = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
syn = { version = "2.0", features = ["full", "parsing"] }
tantivy = "0.26"
tempfile = "3.13"
thiserror = "2.0"
