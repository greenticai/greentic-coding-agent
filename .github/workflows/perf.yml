name: Perf (lightweight)
# Moved off pull_request onto a nightly schedule. See
# plans/binary-bifurcation.md Phase A.4 (Wave 2).

on:
  schedule:
    # 05:33 UTC — staggered slot for greentic-coding-agent.
    - cron: "33 5 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Run perf guard tests
        run: cargo test -p gca-core --test perf_scaling --test perf_timeout
      - name: Run Criterion smoke benchmark
        run: cargo bench -p gca-core --bench perf -- --sample-size 10
