name: Perf (lightweight)
# Nightly-only. See plans/binary-bifurcation.md Phase A.8: push-trigger removed
# because post-merge perf runs were burning 15+ min without actionable signal.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

jobs:
  perf:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Run perf guard tests
        run: cargo test -p gca-core --test perf_scaling --test perf_timeout
      - name: Run Criterion smoke benchmark
        run: cargo bench -p gca-core --bench perf -- --sample-size 10
