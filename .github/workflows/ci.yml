name: CI
on:
  workflow_call:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/pr-ci.yml@main
    with:
      variant: host
      # dependency-review already runs via dependency-review.yml; avoid
      # duplicate runs.
      run-dependency-review: false

  # Validates that crate metadata, packaging, and dry-run publish all pass.
  # Entangled with ci/local_check.sh; kept as a sibling rather than folded
  # into pr-ci.yml.
  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate packaging and crates.io dry-runs
        run: bash ci/local_check.sh --mode package
