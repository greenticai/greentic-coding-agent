name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    uses: greenticai/.github/.github/workflows/release-binaries.yml@main
    with:
      package: greentic-coding-agent
      binary: greentic-coding-agent
      rust-version: "1.95.0"
      extra-files: |
        README.md
        crates/gca-cli/LICENSE
      windows-archive-format: zip
      publish-ghcr: true
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  publish-crates:
    needs: release-binaries
    uses: greenticai/.github/.github/workflows/crates-publish.yml@main
    with:
      crates: greentic-coding-agent
      rust-version: "1.95.0"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
